<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 text-center">

                    @if (perfil(); as p) {
                        <i class="bi bi-person-circle display-3 text-primary"></i>
                        <h3 class="fw-bold mt-2">¡Hola, {{ p.nombre }}!</h3>
                        <p class="text-secondary">{{ p.email }}</p>

                        <span class="badge text-bg-primary me-1">{{ p.nombreRol }}</span>
                        <span class="badge text-bg-secondary">{{ p.plan }}</span>
                    } @else if (error()) {
                        <div class="alert alert-danger mb-0">{{ error() }}</div>
                    } @else {
                        <div class="spinner-border text-primary" role="status"></div>
                    }

                </div>
            </div>
        </div>
    </div>
</div>
