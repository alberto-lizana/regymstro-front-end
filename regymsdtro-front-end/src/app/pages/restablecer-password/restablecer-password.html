<div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center bg-body-tertiary">
    <div class="card shadow border-0 rounded-4 w-100" style="max-width: 420px;">
        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
                <h2 class="fw-bold">Nueva contraseña</h2>
                <p class="text-secondary">Ingresa el código y tu nueva contraseña</p>
            </div>

            <form [formGroup]="restablecerForm" (ngSubmit)="restablecer()">

                <div class="mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" formControlName="email"
                        [class.is-invalid]="restablecerForm.controls.email.touched && restablecerForm.controls.email.invalid">
                    <div class="invalid-feedback">Introduce un correo electrónico válido.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Código</label>
                    <input type="text" inputmode="numeric" maxlength="6" class="form-control"
                        formControlName="codigo" placeholder="6 dígitos"
                        [class.is-invalid]="restablecerForm.controls.codigo.touched && restablecerForm.controls.codigo.invalid">
                    <div class="invalid-feedback">El código tiene 6 dígitos.</div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Nueva contraseña</label>
                    <input type="password" class="form-control" formControlName="nuevaPassword"
                        [class.is-invalid]="restablecerForm.controls.nuevaPassword.touched && restablecerForm.controls.nuevaPassword.invalid">
                    <div class="invalid-feedback">La nueva contraseña es obligatoria.</div>
                </div>

                @if (mensajeError()) {
                    <div class="alert alert-danger" role="alert">{{ mensajeError() }}</div>
                }

                <button type="submit" class="btn btn-primary w-100"
                    [disabled]="restablecerForm.invalid || cargando()">
                    @if (cargando()) {
                        <span class="spinner-border spinner-border-sm me-2"></span>
                    }
                    Cambiar contraseña
                </button>
            </form>

            <div class="text-center mt-3 small">
                <a routerLink="/login">Volver al login</a>
            </div>
        </div>
    </div>
</div>
