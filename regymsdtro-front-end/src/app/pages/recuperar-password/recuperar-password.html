<div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center bg-body-tertiary">
    <div class="card shadow border-0 rounded-4 w-100" style="max-width: 420px;">
        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
                <h2 class="fw-bold">Recuperar contraseña</h2>
                <p class="text-secondary">Ingresa tu correo para obtener un código</p>
            </div>

            @if (mensajeError()) {
                <div class="alert alert-danger" role="alert">{{ mensajeError() }}</div>
            }

            @if (codigo(); as c) {
                <div class="alert alert-success">
                    Tu código es <strong>{{ c }}</strong>. Vence en 10 minutos.
                </div>
                <button type="button" class="btn btn-primary w-100" (click)="continuar()">
                    Continuar
                </button>
            } @else {
                <form [formGroup]="recuperarForm" (ngSubmit)="solicitarCodigo()">
                    <div class="mb-4">
                        <label class="form-label">Correo electrónico</label>
                        <input
                            type="email"
                            class="form-control"
                            formControlName="email"
                            placeholder="usuario@correo.com"
                            [class.is-invalid]="recuperarForm.controls.email.touched && recuperarForm.controls.email.invalid">
                        <div class="invalid-feedback">Introduce un correo electrónico válido.</div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100"
                        [disabled]="recuperarForm.invalid || cargando()">
                        @if (cargando()) {
                            <span class="spinner-border spinner-border-sm me-2"></span>
                        }
                        Obtener código
                    </button>
                </form>
            }

            <div class="text-center mt-3 small">
                <a routerLink="/login">Volver al login</a>
            </div>
        </div>
    </div>
</div>
